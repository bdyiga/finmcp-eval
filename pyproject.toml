[project]
name = "finmcp-eval"
version = "0.1.0"
description = "Compare an LLM on FinanceBench lookup/calculation questions with and without MCP tools (SEC facts + calculator)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.3.0",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "pandas>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
]

[project.scripts]
finmcp-server = "finmcp_eval.server:main"
finmcp-eval = "finmcp_eval.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finmcp_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
